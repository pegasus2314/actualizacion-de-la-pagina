name: Fix participants tabs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-tabs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix teams pane visibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('participants-details.js')
          s = p.read_text(encoding='utf-8')
          old = "      grid.querySelectorAll('[data-participants-pane]').forEach(x=>x.classList.toggle('hidden',x.dataset.participantsPane!==target));"
          new = "      grid.querySelectorAll('[data-participants-pane]').forEach(x=>{\n        const active=x.dataset.participantsPane===target;\n        x.classList.remove('hidden');\n        x.toggleAttribute('hidden',!active);\n        x.setAttribute('aria-hidden',active?'false':'true');\n      });"
          if old not in s:
              raise SystemExit('Expected tab visibility line not found')
          s = s.replace(old, new, 1)
          old_html = '<div class="participants-pane" data-participants-pane="people"></div>\n      <div class="participants-pane hidden" data-participants-pane="teams"></div>`;'
          new_html = '<div class="participants-pane" data-participants-pane="people" aria-hidden="false"></div>\n      <div class="participants-pane" data-participants-pane="teams" hidden aria-hidden="true"></div>`;'
          if old_html not in s:
              raise SystemExit('Expected pane markup not found')
          s = s.replace(old_html, new_html, 1)
          anchor = '    .participants-pane.hidden,.person-card.hidden{display:none!important}\n'
          css = '    .participants-pane[hidden]{display:none!important}\n'
          if css.strip() not in s:
              s = s.replace(anchor, anchor + css, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add participants-details.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: corregir pestaña de equipos de participantes'
          git push

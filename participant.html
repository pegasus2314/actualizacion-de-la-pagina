<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ficha del participante | TRD La Regional Esmeralda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body><main class="page-shell"><div class="page-brand"><img src="assets/logo-regional17.svg" alt="Regional 17"><div><b>TRD La Regional Esmeralda</b><small>Ficha de participante · Regional 17</small></div></div><section id="profile" class="page-card"><div class="eyebrow">IDENTIFICACIÓN DEL PARTICIPANTE</div><div class="avatar">♙</div><h1 class="name">Cargando…</h1><div class="team">Estamos consultando la ficha del participante.</div></section><a class="btn outline" style="margin-top:20px" href="index.html#participantes">← Volver a participantes</a></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://bstdgcpakqmltifzaqso.supabase.co','sb_publishable_-39OPIl11i5GSPBbF3q0ew_puLiVK7N');
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
const labelRole=r=>r==='alternate'?'Suplente':'Debatiente';
const item=(label,value)=>`<div class="data-field"><span>${label}</span><strong>${esc(value||'—')}</strong></div>`;
async function load(){
 const id=new URLSearchParams(location.search).get('id'),box=document.querySelector('#profile');
 if(!id){box.innerHTML='<div class="eyebrow">FICHA NO DISPONIBLE</div><h1 class="name">Participante no encontrado</h1><p class="note">El código de la ficha no es válido.</p>';return}
 const {data,error}=await db.rpc('get_esmeralda_public_debater',{p_debater_id:id});
 if(error||!data?.length){box.innerHTML='<div class="eyebrow">FICHA NO DISPONIBLE</div><h1 class="name">Participante no encontrado</h1><p class="note">La ficha no existe, no está publicada o el equipo todavía no ha sido aprobado.</p>';return}
 const p=data[0];
 box.innerHTML=`<div class="eyebrow">PARTICIPANTE REGISTRADO</div><div class="avatar">♙</div><h1 class="name">${esc(p.full_name)}</h1><div class="team">${esc(p.team_name)}</div><div class="field-grid">${item('Centro educativo',p.school_name)}${item('Distrito',p.district)}${item('Curso / grado',p.grade)}${item('Rol',labelRole(p.role))}${item('ID del participante',p.id)}${item('Equipo',p.team_name)}</div><div id="privateInfo"></div><p class="note">La ficha pública muestra la información necesaria para identificar al participante. Los datos de contacto solo aparecen cuando el QR es consultado con una sesión autorizada del personal del TRD.</p>`;
 const {data:sessionData}=await db.auth.getSession();
 if(sessionData?.session?.user){
   const {data:staff}=await db.from('esmeralda_staff_roles').select('role').eq('user_id',sessionData.session.user.id).maybeSingle();
   if(staff){
     const [{data:full},{data:team},{data:coach}]=await Promise.all([
       db.from('esmeralda_debaters').select('full_name,email,phone,grade,role,consent').eq('id',id).maybeSingle(),
       db.from('esmeralda_teams').select('team_name,school_name,district,contact_name,contact_email,contact_phone,status').eq('id',p.team_id).maybeSingle(),
       db.from('esmeralda_coaches').select('full_name,email,phone,school_name,district,consent').eq('team_id',p.team_id).maybeSingle()
     ]);
     const privateBox=document.querySelector('#privateInfo');
     if(privateBox)privateBox.innerHTML=`<div class="private-box"><span class="eyebrow">FICHA COMPLETA · PERSONAL AUTORIZADO</span><div class="field-grid" style="margin-top:10px">${item('Correo del participante',full?.email)}${item('Teléfono del participante',full?.phone)}${item('Consentimiento',full?.consent?'Confirmado':'No confirmado')}${item('Estado del equipo',team?.status==='approved'?'Aprobado':team?.status)}</div><div class="field-grid" style="margin-top:10px">${item('Responsable del equipo',team?.contact_name)}${item('Correo del responsable',team?.contact_email)}${item('Teléfono del responsable',team?.contact_phone)}${item('Centro del equipo',team?.school_name)}</div><div class="field-grid" style="margin-top:10px">${item('Docente Coach',coach?.full_name)}${item('Correo Coach',coach?.email)}${item('Teléfono Coach',coach?.phone)}${item('Centro Coach',coach?.school_name)}</div></div>`;
   }
 }
}
load();
</script></body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Acreditación | TRD La Regional Esmeralda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#061522;--panel:#0b2233;--panel2:#0e2b3e;--cyan:#19dce5;--mint:#b6e7ff;--text:#eef8fb;--muted:#8fa8b6;--danger:#ff7180}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0c2a3d 0,#061522 48%);min-height:100vh;color:var(--text);font-family:Barlow,sans-serif}.wrap{width:min(900px,calc(100% - 32px));margin:0 auto;padding:42px 0 70px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:30px}.brand img{width:52px}.brand b{display:block;font-family:'Barlow Condensed';font-size:24px}.brand small{color:var(--muted)}.card{background:rgba(11,34,51,.92);border:1px solid rgba(182,231,255,.12);border-radius:22px;padding:30px;box-shadow:0 25px 70px rgba(0,0,0,.25)}.eyebrow{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.15em}.card h1{font-family:'Barlow Condensed';font-size:42px;margin:8px 0}.status{display:inline-flex;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;margin:4px 0 24px}.accredited{background:rgba(67,220,160,.12);color:#66e6b0}.pending{background:rgba(255,193,77,.12);color:#ffd06a}.rejected{background:rgba(255,113,128,.12);color:#ff8995}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{padding:15px 16px;background:rgba(182,231,255,.035);border:1px solid rgba(182,231,255,.07);border-radius:13px}.field span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field strong{font-size:15px}.private{margin-top:18px;padding-top:20px;border-top:1px solid rgba(182,231,255,.08)}.note{color:var(--muted);font-size:12px;line-height:1.55}.btn{display:inline-block;margin-top:22px;padding:11px 16px;border-radius:10px;text-decoration:none;background:var(--cyan);color:#04151d;font-weight:800;border:0;cursor:pointer}.error{color:var(--danger)}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:22px}.card h1{font-size:34px}}
</style></head>
<body><div class="wrap"><div class="brand"><img src="assets/logo-regional17.svg" alt="Regional 17"><div><b>TRD La Regional Esmeralda</b><small>Sistema de acreditación</small></div></div><main id="app" class="card"><span class="eyebrow">VERIFICACIÓN QR</span><h1>Cargando acreditación…</h1></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="acreditacion.js"></script>
</body></html>
